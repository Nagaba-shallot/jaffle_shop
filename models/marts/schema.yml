version: 2

models:
  - name: customers
    description: One row per customer, with order history and lifetime value.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: orders
    description: One row per order, with the total of successful payments.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null